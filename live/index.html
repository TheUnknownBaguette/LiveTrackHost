<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Gustavo live</title><style>html,body{margin:0;height:100%}body{display:grid;place-items:center;padding:28px;box-sizing:border-box;background:#e9eff2;color:#1b2f3a;font:400 17px/1.55 "Avenir Next",Avenir,"Segoe UI",Roboto,system-ui,sans-serif}main{max-width:30ch}h1{font-size:30px;line-height:1.15;font-weight:700;letter-spacing:-.02em;margin:18px 0 10px}p{margin:0;color:#4d6573}.dot{display:block;width:14px;height:14px;border-radius:50%;background:#9fb2bd}.dot.live{background:#f26b1d;animation:p 1.6s infinite}@keyframes p{0%{box-shadow:0 0 0 0 rgba(242,107,29,.5)}70%,100%{box-shadow:0 0 0 14px rgba(242,107,29,0)}}@media (prefers-reduced-motion:reduce){.dot.live{animation:none}}.btn{display:inline-block;margin-top:20px;padding:12px 22px;border-radius:10px;background:#1b2f3a;color:#fff;text-decoration:none;font-weight:600}.btn:focus-visible{outline:3px solid #f26b1d;outline-offset:3px}@media (prefers-color-scheme:dark){body{background:#14222b;color:#e6eef2}p{color:#9fb2bd}.btn{background:#e6eef2;color:#14222b}}</style></head><body><main><span class="dot"></span><h1>Gustavo isn’t riding right now</h1><p>This link goes live when a ride starts. Leave the page open and it checks again every minute.</p></main><script>setTimeout(function(){location.replace(location.pathname+"?t="+Date.now());},60000);</script></body></html>
